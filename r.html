<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Naanya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Public+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #14233B; --text: #3A4556; --muted: #7A8494; --rule: #D9DEE5;
    --accent: #0E6B6B; --accent-dark: #0A5454; --tint: #F2F6F6; --bg: #EEF1F4; --danger: #A8321F;
    --serif: 'Newsreader', Georgia, 'Times New Roman', serif;
    --sans: 'Public Sans', Arial, Helvetica, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 16px; line-height: 1.6; }
  .wrap { max-width: 600px; margin: 48px auto; padding: 0 16px; }
  .sheet { background: #fff; border-top: 4px solid var(--ink); }
  header { padding: 24px 40px 18px; border-bottom: 1px solid var(--rule); }
  .mark { font-family: var(--serif); font-size: 24px; color: var(--ink); letter-spacing: .5px; text-decoration: none; }
  main { padding: 36px 40px 40px; }
  .q { font-family: var(--serif); font-weight: 400; font-size: 26px; line-height: 1.35; color: var(--ink); margin: 0 0 28px; }
  fieldset { border: 0; margin: 0 0 24px; padding: 0; }
  legend { font-size: 14px; color: var(--muted); margin-bottom: 10px; padding: 0; }
  .opt { display: flex; align-items: center; gap: 14px; padding: 16px 18px; border: 1px solid var(--rule); cursor: pointer; font-size: 16px; color: var(--ink); background: #fff; }
  .opt + .opt { border-top: 0; }
  .opt input { accent-color: var(--accent); width: 18px; height: 18px; margin: 0; }
  .opt:has(input:checked) { background: var(--tint); box-shadow: inset 3px 0 0 var(--accent); }
  .opt:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: -2px; }
  button { font-family: var(--sans); font-size: 16px; font-weight: 600; background: var(--accent); color: #fff; border: 0; border-radius: 4px; padding: 14px 32px; cursor: pointer; }
  button:hover { background: var(--accent-dark); }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  button:disabled { opacity: .6; cursor: default; }
  .note { font-size: 14px; color: var(--muted); margin: 14px 0 0; }
  .err { color: var(--danger); }
  .done h1 { font-family: var(--serif); font-weight: 500; font-size: 34px; color: var(--ink); margin: 0 0 12px; }
  .done p { margin: 0 0 12px; max-width: 46ch; }
  .done .answer { display: inline-block; font-size: 14px; color: var(--accent); background: var(--tint); padding: 4px 10px; margin-bottom: 16px; }
  .done { animation: in .35s ease-out; }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .done { animation: none; } }
  footer { padding: 16px 40px; border-top: 1px solid var(--rule); font-size: 13px; color: var(--muted); }
  footer a { color: var(--accent); text-decoration: none; }
  @media (max-width: 520px) {
    .wrap { margin: 0; padding: 0; }
    header, main, footer { padding-left: 22px; padding-right: 22px; }
    .q { font-size: 22px; }
    button { width: 100%; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="sheet">
    <header><a class="mark" href="https://naanya.tech">Naanya</a></header>
    <main id="main">
      <p class="q">Is getting control of your company's AI projects (what's running, what it costs, and what's working) a priority for you in the next six months?</p>
      <div id="form"></div>
    </main>
    <footer>Lakshmi Peri, Founder, Naanya &nbsp;|&nbsp; <a href="https://naanya.tech">naanya.tech</a></footer>
  </div>
</div>
<script>
  // Paste your Apps Script Web app URL (ends with /exec)
  var SCRIPT_URL = 'var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwerr6Xg5F87POG0nd0NfOj4rnSgKPaZETtQ2KZ7RztQMu_khOedIKAKD1zBK6gf-dGTg/exec';';

  var LABELS = { yes: "Yes, it's a priority", no: 'Not right now' };
  var THANKS = {
    yes: "I'll reach out personally within two business days to find a time that suits you.",
    no: "Understood. I won't follow up on this, and I appreciate you letting me know."
  };

  var p = new URLSearchParams(location.search);
  var t = (p.get('t') || '').trim();
  var a = (p.get('a') || '').toLowerCase();
  var form = document.getElementById('form');
  var main = document.getElementById('main');

  function esc(s) { return s.replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  if (!/^[a-f0-9]{32}$/.test(t) || (a !== 'yes' && a !== 'no')) {
    form.innerHTML = '<p class="err">This link isn\'t complete. Open it again from the email, or reply to the email with your answer.</p>';
  } else {
    form.innerHTML =
      '<fieldset><legend>Your answer</legend>' +
      ['yes', 'no'].map(function (k) {
        return '<label class="opt"><input type="radio" name="ans" value="' + k + '"' + (k === a ? ' checked' : '') + '> ' + esc(LABELS[k]) + '</label>';
      }).join('') +
      '</fieldset>' +
      '<button id="btn" type="button">Confirm answer</button>' +
      '<p id="msg" class="note">You can change your answer before confirming.</p>';

    var btn = document.getElementById('btn');
    var msg = document.getElementById('msg');
    btn.addEventListener('click', function () {
      var choice = document.querySelector('input[name="ans"]:checked').value;
      btn.disabled = true;
      msg.className = 'note';
      msg.textContent = 'Saving your answer…';
      fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ t: t, a: choice }) })
        .then(function (r) { return r.json(); })
        .then(function (res) {
          if (res.ok) {
            main.innerHTML = '<div class="done"><span class="answer">' + esc(LABELS[choice]) + '</span>' +
              '<h1>Thank you.</h1><p>' + esc(THANKS[choice]) + '</p>' +
              '<p class="note">Your answer is saved. You can close this page.</p></div>';
          } else {
            btn.disabled = false;
            msg.className = 'note err';
            msg.textContent = res.message + ' Reply to the email with your answer instead.';
          }
        })
        .catch(function () {
          btn.disabled = false;
          msg.className = 'note err';
          msg.textContent = "Your answer wasn't saved. Check your connection and select Confirm answer again.";
        });
    });
  }
</script>
</body>
</html>
